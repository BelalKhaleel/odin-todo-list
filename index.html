<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Todo List</title><script defer="defer" src="bundle.js"></script></head><body><div class="container"><aside class="sidebar"><h1>Task Manager</h1><nav><section class="sidebar-nav-tasks"><h2>Tasks</h2><ul><li><button class="sidebar-nav-item add-task">Add task</button></li><li><button class="sidebar-nav-item today">Today</button></li><li><button class="sidebar-nav-item upcoming">Upcoming</button></li><li><button class="sidebar-nav-item important">Important</button></li><li><button class="sidebar-nav-item completed">Completed</button></li><li><button class="sidebar-nav-item open-folder all-tasks">All Tasks</button></li></ul></section><section class="sidebar-nav-projects"><h2>Projects</h2><ul><li class="add-project-container"><input class="new-project-input" placeholder="Add new (unique) project"/> <button class="new-project-btn">+</button></li></ul></section></nav></aside><main><div class="main-header"><h2 class="current-project"></h2><div class="priorities"><span class="priority high-priority">High priority</span> <span class="priority medium-priority">Medium priority</span> <span class="priority low-priority">Low priority</span></div></div><div class="tasks-container"></div><dialog><form method="dialog"><label for="task-title-input">Task Name:</label> <input id="task-title-input" name="task-title" placeholder="Enter task name" required/> <label for="task-description-input">Description:</label> <textarea id="task-description-input" name="task-description" placeholder="Add description or notes" rows="5" cols="40" required></textarea> <label for="task-due-date-input">Due Date:</label> <input type="datetime-local" id="task-due-date-input" name="task-due-date" required/> <label for="task-priority-input">Priority:</label> <select id="task-priority-input" name="task-priority"><option class="priority-option" value="low">Low</option><option class="priority-option" value="medium" selected="selected">Medium</option><option class="priority-option" value="high">High</option></select> <label for="task-project">Select Project of the Task:</label> <select id="task-project" name="task-project"><option class="all-tasks-option" value="all-tasks" selected="selected">All Tasks</option></select><div class="form-btns"><button type="submit" class="form-btn" id="form-task-btn"></button> <button type="button" class="form-btn" id="cancel-task-btn">Close</button></div></form></dialog></main></div></body></html>
