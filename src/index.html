<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <h1 class="sidebar-header">Task Manager</h1>
        <div class="sidebar-nav-tasks">
          <h2>Tasks</h2>
          <button class="sidebar-nav-item add-task">
            <span class="nav-item-title ">Add task</span>
          </button>
          <button class="sidebar-nav-item today">
            <span class="nav-item-title">Today</span>
          </button>
          <button class="sidebar-nav-item upcoming">
            <span class="nav-item-title">Upcoming</span>
          </button>
          <button class="sidebar-nav-item important">
            <span class="nav-item-title">Important</span>
          </button>
          <button class="sidebar-nav-item completed">
            <span class="nav-item-title">Completed</span>
          </button>
        </div>
        <div class="sidebar-nav-projects-section">
          <h2 class="projects">Projects</h2>
          <div class="new-project-container">
            <input
              class="new-project-input"
              type="text"
              placeholder="Add new (unique) project"
              required
              autofocus
            />
            <button class="sidebar-nav-item new-project-btn">
            </button>
          </div>
          <div class="sidebar-nav-projects">
            <button class="sidebar-nav-item open-folder sidebar-nav-project">
              <span class="nav-item-title">All Tasks</span>
            </button>
          </div>
        </div>
      </aside>
      <main>
        <div class="main-header">
          <h2>All Tasks</h2>
          <div class="priorities">
            <div class="priority">
              <span class="high-priority">High priority</span>
            </div>
            <div class="priority">
              <span class="medium-priority">Medium priority</span>
            </div>
            <div class="priority">
              <span class="low-priority">Low priority</span>
            </div>
          </div>
        </div>
        <div class="task-cards"></div>
        <dialog>
          <form method="dialog" id="task-form">
            <label for="task-title-input">Task Name:</label>
            <input type="text" id="task-title-input" placeholder="Enter task name" required>
            <label for="task-description-input">Description:</label>
            <textarea id="task-description-input" placeholder="Add description or notes" rows="5" cols="40" required></textarea>
            <label for="task-due-date-input">Due Date:</label>
            <input type="date" id="task-due-date-input" required>
            <label for="task-priority-input">Priority:</label>
            <select id="task-priority-input">
              <option value="" disabled>Choose task priority</option>
              <option class="priority-option" value="low">Low</option>
              <option class="priority-option" value="medium" selected>Medium</option>
              <option class="priority-option" value="high">High</option>
            </select>
            <label for="task-project">Select Project:</label>
            <select name="" id="task-project">
              <option value="" disabled>Select to which project the task belongs</option>
            </select>
            <div class="form-btns">
              <button type="submit" class="form-btn" id="form-task-btn"></button>
              <button type="button" class="form-btn" id="cancel-task-btn">Cancel</button>
            </div>
          </form>
        </dialog>
      </main>
    </div>
  </body>
</html>
