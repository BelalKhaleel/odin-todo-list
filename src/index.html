<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div class="container">
      <aside class="sidebar">
        <h1>Task Manager</h1>
        <nav>
          <section class="sidebar-nav-tasks">
            <h2>Tasks</h2>
            <ul>
              <li>
                <button class="sidebar-nav-item add-task">Add task</button>
              </li>
              <li>
                <button class="sidebar-nav-item today">Today</button>
              </li>
              <li>
                <button class="sidebar-nav-item upcoming">Upcoming</button>
              </li>
              <li>
                <button class="sidebar-nav-item important">Important</button>
              </li>
              <li>
                <button class="sidebar-nav-item completed">Completed</button>
              </li>
            </ul>
          </section>
          <section class="sidebar-nav-projects">
            <h2>Projects</h2>
            <ul>
              <li class="add-project-container">
                <input
                  class="new-project-input"
                  type="text"
                  placeholder="Add new (unique) project"
                  required
                  autofocus
                />
                <button class="new-project-btn">+</button>
              </li>
              <li>
                <button class="sidebar-nav-item open-folder sidebar-nav-project">All Tasks</button>
              </li>
            </ul>
          </section>
        </nav>
      </aside>
      <main>
        <div class="main-header">
          <h2>All Tasks</h2>
          <div class="priorities">
            <span class="priority high-priority">High priority</span>
            <span class="priority medium-priority">Medium priority</span>
            <span class="priority low-priority">Low priority</span>
          </div>
        </div>
        <div class="task-cards"></div>
        <dialog>
          <form method="dialog">
            <label for="task-title-input">Task Name:</label>
            <input type="text" id="task-title-input" placeholder="Enter task name" required>
            <label for="task-description-input">Description:</label>
            <textarea id="task-description-input" placeholder="Add description or notes" rows="5" cols="40" required></textarea>
            <label for="task-due-date-input">Due Date:</label>
            <input type="date" id="task-due-date-input" required>
            <label for="task-priority-input">Priority:</label>
            <select id="task-priority-input">
              <option class="priority-option" value="low">Low</option>
              <option class="priority-option" value="medium" selected>Medium</option>
              <option class="priority-option" value="high">High</option>
            </select>
            <label for="task-project">Select Project of the Task:</label>
            <select name="" id="task-project">
            </select>
            <div class="form-btns">
              <button type="submit" class="form-btn" id="form-add-task-btn"></button>
              <button type="button" class="form-btn" id="cancel-task-btn">Cancel</button>
            </div>
          </form>
        </dialog>
      </main>
    </div>
  </body>
</html>
